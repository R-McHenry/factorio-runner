# The same win arm as sa-deepseek-fk-win, played by Claude Opus instead of DeepSeek.
#
# Auth is a Claude subscription, not an API key: the runner shells out to the `claude` CLI with
# its tools disabled and one runner tool call forced per turn. Use Rory's account, never Gump's:
#   CLAUDE_CONFIG_DIR=~/.claude/accounts/rory python -m runner episode ...
# In GitHub Actions, the workflow supplies CLAUDE_CODE_OAUTH_TOKEN from Rory's account instead.
#
# billing = "subscription" means the ledger records $0 (the cost is subscription usage); the
# per-episode/session USD caps below are therefore just safety rails, not spend limits.
arm = "sa-opus-fk-win"

[game]
factorio = "2.0.77"
mods = "../game/space-age-early/mods"
map_gen = "../game/space-age/map-gen-settings.json"
map_settings = "../game/space-age/map-settings.json"
seed = 1
kit = "kickoff-early-bots"
codebase = "../game/space-age-early/codebase"

[agent]
provider = "claude"
provider_name = "claude"
model = "claude-opus-5-5"
binary = "claude"
billing = "subscription"
auto_compact_window = 400000   # Claude Code compacts at 400k; the runner ceiling is higher
timeout = 1200
max_retries = 2

[toolkit]
profile = "fk"
pack = "sa-early"
timeout_s = 900

[prompt]
# l3-winrush replaces l2-scalable for this arm: the scalable-base layer pushes scaffolding,
# refactoring and room-to-grow, which is right for a base contest but wrong for a rocket
# speedrun. Five episodes reached red+green then spent their turn budget on the base; this
# layer makes the ladder rung and the blue oil chain the only priority.
layers = ["l0-lab-fk", "l3-winrush"]
facts_p = 0.5

[objective]
mode = "ladder"

[episode]
# 1000 turns, not 350: every episode restarts at tick 36 and rebuilds the base, and
# runs 41937118725/41946204641/41951412382 all died on the turn cap around green
# science, never reaching blue. The ladder horizon (~1.30M ticks) allows ~1000 turns
# at the observed ~1.2k ticks/turn, so give the agent the whole horizon.
max_turns = 1000
max_usd = 1000.0          # subscription: not dollars, just a rail that never trips
max_ticks = 1300000       # the ladder's own horizon is 1,297,836; do not stop short of it
goal_dist = 3             # unused in ladder mode, kept so the spec is explicit
check_every = 600
eval_cap = 36000
snapshot_every = 7200

[budget]
monthly_usd = 0.0
hard_usd = 0.0

[session]
episodes = 1
next = "select"
max_usd = 1000.0
context_limit = 500000
