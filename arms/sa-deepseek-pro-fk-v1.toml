# sa-deepseek-fk-v1 on deepseek-v4-pro (early-bots start). Score: the archive's cell height.
# The toolkit run: the early-bots start, DeepSeek with the fk toolkit (a game codebase in its work dir,
# part of every node), and Rory's guide to a base that scales (modules, scaffolding, paying down
# debt) as its own prompt layer, so it can be switched off.
arm = "sa-deepseek-pro-fk-v1"

[game]
factorio = "2.0.77"
mods = "../game/space-age-early/mods"
map_gen = "../game/space-age/map-gen-settings.json"
map_settings = "../game/space-age/map-settings.json"
seed = 1
kit = "kickoff-early-bots"
codebase = "../game/space-age-early/codebase"

[agent]
provider = "openai"
provider_name = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
temperature = 0.7
max_tokens = 16384          # a reasoning model's thinking counts against this
max_tokens_ceiling = 65536  # a turn cut off with no answer is asked again with 4x, up to this
# $ per million tokens for deepseek-v4-pro: sources disagree (2026-11-04: 0.435/0.87 promo vs
# 1.32/3.96 peak, cache 0.0036-0.044), so the highest seen, to over- rather than under-count
price = { in_hit = 0.044, in_miss = 1.74, out = 3.96 }

[toolkit]
profile = "fk"
pack = "sa-early"
timeout_s = 900

[prompt]
layers = ["l0-lab-fk", "l2-scalable"]
facts_p = 0.5

[episode]
max_turns = 60
max_usd = 1.5