# The win arm: play until the first rocket, not until a production cell is filled.
# Same early-bots start, DeepSeek and the fk toolkit as sa-deepseek-fk-v1, with the milestone
# ladder as the objective and a game-time horizon long enough for a real base (one in-game day is
# 216000 ticks; this is five and a half). `episode.check_every` stays 600, so a long evaluate is
# still split into small state reads and the victory check is never far behind the game.
arm = "sa-deepseek-fk-win"

[game]
factorio = "2.0.77"
mods = "../game/space-age-early/mods"
map_gen = "../game/space-age/map-gen-settings.json"
map_settings = "../game/space-age/map-settings.json"
seed = 1
kit = "kickoff-early-bots"
codebase = "../game/space-age-early/codebase"

[agent]
provider = "openai"
provider_name = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
temperature = 0.7
max_tokens = 16384
max_tokens_ceiling = 65536
# $ per million tokens; third-party snapshot 2026-11 (off-peak flash), check before trusting
price = { in_hit = 0.003, in_miss = 0.15, out = 0.60 }

[toolkit]
profile = "fk"
pack = "sa-early"
timeout_s = 900

[prompt]
layers = ["l0-lab-fk", "l2-scalable"]
facts_p = 0.5

[objective]
mode = "ladder"

[episode]
max_turns = 350
max_usd = 0.6
max_ticks = 1200000       # > 1M ticks: the ladder has room for a whole factory
goal_dist = 3             # unused in ladder mode, kept so the spec is explicit
check_every = 600
eval_cap = 36000
snapshot_every = 7200

[budget]
monthly_usd = 10.0
hard_usd = 100.0

[session]
episodes = 1
next = "select"
max_usd = 1.0
context_limit = 100000
