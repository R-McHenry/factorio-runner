# Dispatch from a cloud session or the Actions tab. With repo variables AWS_ROLE_ARN and
# STORE_BUCKET set, the store is S3 and `jobs` episodes run in parallel; without them the store is
# local to one job and uploaded as an artifact (a smoke run).
name: run
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "fresh | episode | smoke (fresh + n sessions) | show | status | ping"
        required: true
        default: episode
      arm:
        description: "arm spec path"
        required: true
        default: arms/sa-deepseek-bare.toml
      jobs:
        description: "parallel jobs (episode, S3 only)"
        default: "1"
      n:
        description: "sessions per job (each runs the arm's session.episodes episodes)"
        default: "1"
      prefix:
        description: "store prefix inside the bucket"
        default: "v0"
      store:
        description: "s3 (when the repo variables are set) or local (one job, uploaded as an artifact)"
        default: "s3"
permissions:
  contents: read
  id-token: write
concurrency:
  group: run-${{ inputs.arm }}-${{ inputs.cmd }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          J=${{ inputs.jobs }}
          if [ -z "${{ vars.STORE_BUCKET }}" ] || [ "${{ inputs.store }}" = local ] || [ "${{ inputs.cmd }}" != episode ]; then J=1; fi
          echo "matrix=$(python3 -c "import json; print(json.dumps(list(range(int('$J')))))")" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/factorio
          key: factorio-2.0.77-headless-v2
      - name: Fetch Factorio
        shell: bash
        run: python -c "import os; from runner.server import ensure_factorio as e; print(e('2.0.77', os.path.expanduser('~/.cache/factorio')))" | tee factorio-bin
      - name: OIDC claims (what the AWS trust policy must match; not secret)
        if: ${{ vars.AWS_ROLE_ARN != '' && inputs.cmd != 'ping' && inputs.store != 'local' }}
        shell: bash
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          python3 -c "import base64,json,sys; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k: c.get(k) for k in ('iss','aud','sub','repository','repository_owner','ref','job_workflow_ref')}, indent=1))" "$T"
      - name: AWS (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' && inputs.cmd != 'ping' && inputs.store != 'local' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Run
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${{ vars.STORE_BUCKET }}" ] && [ "${{ inputs.cmd }}" != ping ] && [ "${{ inputs.store }}" != local ]; then STORE="s3://${{ vars.STORE_BUCKET }}/${{ inputs.prefix }}"; else STORE=./store; fi
          FACTORIO_BIN=$(cat factorio-bin) python -m runner ${{ inputs.cmd }} ${{ inputs.arm }} \
            --store "$STORE" -n ${{ inputs.n }} --transcript --out ./out
      - name: Upload the sessions' steps and results
        if: ${{ always() && inputs.cmd != 'ping' }}
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.run_id }}-${{ matrix.job }}
          path: out
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the status page (cmd status)
        if: ${{ always() && inputs.cmd == 'status' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_id }}
          path: site
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the local store (no S3 yet)
        if: ${{ always() && (vars.STORE_BUCKET == '' || inputs.store == 'local') && inputs.cmd != 'ping' }}
        uses: actions/upload-artifact@v4
        with:
          name: store-${{ github.run_id }}-${{ matrix.job }}
          path: store
          retention-days: 14
